version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      repository-tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /mentora-api-server
    schedule:
      interval: weekly
    groups:
      api-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /mentora-mobile-app
    schedule:
      interval: weekly
    groups:
      mobile-dependencies:
        patterns: ['*']
