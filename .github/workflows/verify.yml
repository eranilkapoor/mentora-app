name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin the E2E database binary so cache hits do not change when the
      # mongodb-memory-server package changes its recommended default.
      MONGOMS_VERSION: 8.2.6
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/match-mate-api-server/.cache/mongodb-binaries
      MONGOMS_PREFER_GLOBAL_PATH: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            match-mate-api-server/package-lock.json
            match-mate-mobile-app/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix match-mate-api-server

      - name: Install mobile dependencies
        run: npm ci --prefix match-mate-mobile-app

      - name: Cache MongoDB E2E binary
        uses: actions/cache@v4
        with:
          path: match-mate-api-server/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-8.2.6-${{ hashFiles('match-mate-api-server/package-lock.json') }}

      - name: Run verification and tests
        run: npm run ci

      - name: Build API container image
        run: docker build -t match-mate-api:${{ github.sha }} ./match-mate-api-server

      - name: Scan API container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: match-mate-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            match-mate-api-server/coverage
            match-mate-mobile-app/coverage
          retention-days: 14
          if-no-files-found: warn
