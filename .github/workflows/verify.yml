name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            match-mate-api-server/package-lock.json
            match-mate-mobile-app/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix match-mate-api-server

      - name: Install mobile dependencies
        run: npm ci --prefix match-mate-mobile-app

      - name: Run verification and tests
        run: npm run ci
