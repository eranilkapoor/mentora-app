name: CodeQL

on:
  # Manual-only for now.
  # Private repositories need GitHub Code Security/GHAS entitlement for CodeQL
  # result upload. Keeping this off push/PR prevents normal CI from failing
  # when code scanning is not enabled for the repository/account.
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write
  statuses: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show CodeQL run context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
