<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: var(--font-sans);
  }
  .wrap {
    padding: 1rem 0;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .tab {
    padding: 6px 16px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .tab.active {
    background: var(--surface-2);
    border-color: var(--border-stronger);
    color: var(--text-primary);
    font-weight: 500;
  }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
  .dot-platform {
    background: #2563eb;
  }
  .dot-free {
    background: #64748b;
  }
  .dot-starter {
    background: #f59e0b;
  }
  .dot-plus {
    background: #0f766e;
  }
  .dot-mentor {
    background: #7c3aed;
  }
  .dot-enterprise {
    background: #dc2626;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    padding: 8px 10px;
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 0.5px solid var(--border-strong);
    position: sticky;
    top: 0;
    background: var(--surface-2);
    z-index: 1;
  }
  th.plan {
    text-align: center;
    min-width: 84px;
  }
  td {
    padding: 7px 10px;
    border-bottom: 0.5px solid var(--border);
    color: var(--text-primary);
    vertical-align: middle;
  }
  td.feature-name {
    font-size: 12px;
    color: var(--text-primary);
  }
  td.center {
    text-align: center;
  }
  tr:hover td {
    background: var(--surface-1);
  }
  .cat-header td {
    background: var(--surface-1);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-top: 0.5px solid var(--border-strong);
    padding: 6px 10px;
  }
  .scroll {
    max-height: 520px;
    overflow-y: auto;
    border: 0.5px solid var(--border);
    border-radius: 12px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 99px;
    background: var(--bg-success);
    color: var(--text-success);
    font-weight: 500;
  }
  .limited {
    background: var(--bg-warning);
    color: var(--text-warning);
  }
  .none {
    background: var(--bg-danger);
    color: var(--text-danger);
  }
</style>

<div class="wrap">
  <h2 class="sr-only">
    Feature plan matrix for Mentora AI tutoring with Free, Starter, Plus,
    Mentor, and Enterprise tiers
  </h2>

  <div class="tabs">
    <button class="tab active" onclick="showTab('all')">All features</button>
    <button class="tab" onclick="showTab('platform')">Platform</button>
    <button class="tab" onclick="showTab('free')">Free</button>
    <button class="tab" onclick="showTab('starter')">Starter</button>
    <button class="tab" onclick="showTab('plus')">Plus</button>
    <button class="tab" onclick="showTab('mentor')">Mentor</button>
    <button class="tab" onclick="showTab('enterprise')">Enterprise</button>
  </div>

  <div class="legend">
    <span class="legend-item"
      ><span class="dot dot-platform"></span> Platform</span
    >
    <span class="legend-item"><span class="dot dot-free"></span> Free</span>
    <span class="legend-item"
      ><span class="dot dot-starter"></span> Starter</span
    >
    <span class="legend-item"><span class="dot dot-plus"></span> Plus</span>
    <span class="legend-item"><span class="dot dot-mentor"></span> Mentor</span>
    <span class="legend-item"
      ><span class="dot dot-enterprise"></span> Enterprise</span
    >
  </div>

  <div class="scroll" id="tableWrap">
    <table id="featureTable">
      <thead>
        <tr>
          <th style="width: 34%">Feature</th>
          <th class="plan">Platform</th>
          <th class="plan">Free</th>
          <th class="plan">Starter</th>
          <th class="plan">Plus</th>
          <th class="plan">Mentor</th>
          <th class="plan">Enterprise</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
  const P = "platform",
    F = "free",
    S = "starter",
    PLUS = "plus",
    M = "mentor",
    E = "enterprise";
  const TICK = {
    [P]: '<span class="badge">platform</span>',
    [F]: '<span class="badge">yes</span>',
    [S]: '<span class="badge">yes</span>',
    [PLUS]: '<span class="badge">yes</span>',
    [M]: '<span class="badge">yes</span>',
    [E]: '<span class="badge">custom</span>',
    limited: '<span class="badge limited">limited</span>',
    no: '<span class="badge none">-</span>',
  };

  const data = [
    { cat: "Account And Safety" },
    { name: "Email/password login", tiers: [P, P, P, P, P, P] },
    { name: "Student and parent roles", tiers: [P, P, P, P, P, P] },
    { name: "Parent-managed child profiles", tiers: [P, P, P, P, P, P] },
    { name: "Account switcher for children", tiers: [P, P, P, P, P, P] },
    { name: "Parental controls", tiers: [P, "limited", S, PLUS, M, E] },
    { name: "Device/session management", tiers: [P, P, P, P, P, P] },

    { cat: "Student Profile" },
    { name: "Academic onboarding", tiers: [P, P, P, P, P, P] },
    { name: "Profile completion score", tiers: [P, P, P, P, P, P] },
    { name: "Academic records", tiers: [P, P, P, P, P, P] },
    {
      name: "Previous education and exam scores",
      tiers: [null, "limited", S, PLUS, M, E],
    },
    {
      name: "Documents and communication history",
      tiers: [null, null, S, PLUS, M, E],
    },

    { cat: "Learning Access" },
    { name: "Subject enrolment", tiers: [P, P, P, P, P, P] },
    {
      name: "Scheduled AI tutor access",
      tiers: [null, "limited", S, PLUS, M, E],
    },
    {
      name: "AI tutor minutes/month",
      tiers: [null, "sample", "300", "900", "1800", "custom"],
    },
    { name: "Schedule and entitlement guard", tiers: [P, P, P, P, P, P] },
    { name: "Safety moderation events", tiers: [P, P, P, P, P, P] },
    { name: "Session summaries", tiers: [null, null, S, PLUS, M, E] },

    { cat: "Assessments And Progress" },
    {
      name: "Question banks and quizzes",
      tiers: [null, "limited", S, PLUS, M, E],
    },
    {
      name: "Assessment attempts and results",
      tiers: [null, "limited", S, PLUS, M, E],
    },
    { name: "Topic mastery", tiers: [null, null, S, PLUS, M, E] },
    { name: "Learning recommendations", tiers: [null, null, S, PLUS, M, E] },
    { name: "Parent progress dashboard", tiers: [null, null, S, PLUS, M, E] },

    { cat: "Human Mentor And Classroom" },
    { name: "Live class schedule", tiers: [null, null, null, PLUS, M, E] },
    { name: "Audio/video classroom", tiers: [null, null, null, null, M, E] },
    { name: "Tutor notes and homework", tiers: [null, null, null, null, M, E] },
    { name: "Dedicated mentor support", tiers: [null, null, null, null, M, E] },

    { cat: "Payments And Operations" },
    { name: "Subscriptions and invoices", tiers: [P, P, P, P, P, P] },
    { name: "Learning entitlements", tiers: [P, P, P, P, P, P] },
    { name: "Support tickets", tiers: [P, P, P, P, P, P] },
    { name: "Admin safety/content review", tiers: [P, P, P, P, P, P] },
    {
      name: "Enterprise audit exports",
      tiers: [null, null, null, null, null, E],
    },
  ];

  function render(filter = "all") {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    data.forEach((row) => {
      if (row.cat) {
        const tr = document.createElement("tr");
        tr.className = "cat-header";
        tr.innerHTML = `<td colspan="7">${row.cat}</td>`;
        tbody.appendChild(tr);
        return;
      }
      const tr = document.createElement("tr");
      tr.dataset.tiers = row.tiers.filter(Boolean).join(" ");
      if (filter !== "all" && !row.tiers.includes(filter)) return;
      tr.innerHTML =
        `<td class="feature-name">${row.name}</td>` +
        row.tiers
          .map((v) => `<td class="center">${TICK[v] || v || TICK.no}</td>`)
          .join("");
      tbody.appendChild(tr);
    });
  }

  function showTab(filter) {
    document
      .querySelectorAll(".tab")
      .forEach((tab) => tab.classList.remove("active"));
    event.target.classList.add("active");
    render(filter);
  }

  render();
</script>
