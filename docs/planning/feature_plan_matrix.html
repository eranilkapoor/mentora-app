function renderTier(val) {
  if (!val) return '<td class="center">' + TICK.no + '</td>';
  if (val === 'limited') return '<td class="center">' + TICK.limited + '</td>';
  if (val === P) return '<td class="center">' + TICK[P] + '</td>';
  if (val === F) return '<td class="center">' + TICK.yes + '</td>';
  if (val === S) return '<td class="center">' + TICK.yes + '</td>';
  if (val === G) return '<td class="center">' + TICK.yes + '</td>';
  if (val === PL) return '<td class="center">' + TICK.yes + '</td>';
  if (val === E) return '<td class="center">' + TICK[E] + '</td>';
  return '<td class="center">—</td>';
}

let currentTab = 'all';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  let html = '';
  
  data.forEach(row => {
    if (row.cat) {
      if (currentTab === 'all' || shouldShowCategory(row.cat)) {
        html += `<tr class="cat-header"><td colspan="7">${row.cat}</td></tr>`;
      }
      return;
    }
    
    const [pVal, fVal, sVal, gVal, plVal, eVal] = row.tiers;
    
    if (currentTab === 'platform' && pVal !== P) return;
    if (currentTab === 'free' && !fVal && pVal !== P) return;
    if (currentTab === 'silver' && !sVal && pVal !== P) return;
    if (currentTab === 'gold' && !gVal && pVal !== P) return;
    if (currentTab === 'platinum' && !plVal && pVal !== P) return;
    if (currentTab === 'enterprise' && !eVal && pVal !== P) return;
    
    html += `<tr>
      <td class="feature-name">${row.name}</td>
      ${renderTier(pVal)}
      ${renderTier(fVal)}
      ${renderTier(sVal)}
      ${renderTier(gVal)}
      ${renderTier(plVal)}
      ${renderTier(eVal)}
    </tr>`;
  });
  
  tbody.innerHTML = html;
}
